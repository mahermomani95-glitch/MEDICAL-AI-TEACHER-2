name: Produce Batch 001

on:
  workflow_dispatch:
  push:
    branches: ["agent/import-full-question-bank"]
    paths: ["production/**", ".github/workflows/production-batch-001.yml"]

permissions:
  contents: read

env:
  NODE_VERSION: 22
  TTS_VOICE: af_nova

jobs:
  produce-q0001:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure FFmpeg is available
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install HyperFrames
        run: npm install --no-save hyperframes
      - name: Install HyperFrames TTS runtime
        run: |
          set -euo pipefail
          python -m venv .tts-venv
          . .tts-venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input --upgrade pip
          python -m pip install --disable-pip-version-check --no-input kokoro-onnx soundfile
          python -c "import kokoro_onnx, soundfile; print('TTS runtime OK')"
          echo "HYPERFRAMES_PYTHON=$PWD/.tts-venv/bin/python" >> "$GITHUB_ENV"
      - name: Check TTS voices
        run: npx hyperframes tts --list
      - name: Generate production narration locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/audio production/render
          printf '%s\n' 'In obstructive jaundice, bleeding tendency is due to deficiency of the following clotting factors except? The options are factor two, factor seven, factor eight, factor nine and factor ten. Dr. Anas proposes factor eight.' > production/audio/01.txt
          printf '%s\n' 'Correct. Factor eight is the exception. The key is to recognize which clotting factors depend on vitamin K.' > production/audio/02.txt
          printf '%s\n' 'Obstructive jaundice reduces bile delivery to the intestine. This impairs absorption of fat-soluble vitamin K. As a result, vitamin K-dependent clotting factors, especially factors two, seven, nine and ten, decrease.' > production/audio/03.txt
          printf '%s\n' 'Why are the other choices wrong? Factors two, seven, nine and ten are vitamin K dependent, so they are reduced when vitamin K absorption is impaired. Factor eight is not vitamin K dependent, so it is the exception.' > production/audio/04.txt
          printf '%s\n' 'Exam trap: do not confuse factor eight with the vitamin K-dependent factors. The high-yield sequence is two, seven, nine and ten.' > production/audio/05.txt
          printf '%s\n' 'Take-home: obstructive jaundice means reduced vitamin K absorption and reduced factors two, seven, nine and ten. Factor eight is the exception.' > production/audio/06.txt
          for n in 01 02 03 04 05 06; do
            npx hyperframes tts "production/audio/${n}.txt" --voice "$TTS_VOICE" --output "production/audio/${n}.wav"
            test -s "production/audio/${n}.wav"
            ffprobe -v error -show_entries format=format_name,duration -of default=noprint_wrappers=1 "production/audio/${n}.wav"
          done
          fit_audio() {
            local src="$1" dst="$2" target="$3"
            local dur ratio
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$src")
            ratio=$(awk -v d="$dur" -v t="$target" 'BEGIN { r=d/t; if (r<0.5) r=0.5; if (r>2) r=2; printf "%.6f", r }')
            ffmpeg -y -v error -i "$src" -af "atempo=${ratio},apad" -t "$target" -ar 48000 -ac 2 -c:a pcm_s16le "$dst"
          }
          fit_audio production/audio/01.wav production/audio/01-fit.wav 10
          fit_audio production/audio/02.wav production/audio/02-fit.wav 8
          fit_audio production/audio/03.wav production/audio/03-fit.wav 12
          fit_audio production/audio/04.wav production/audio/04-fit.wav 12
          fit_audio production/audio/05.wav production/audio/05-fit.wav 10
          fit_audio production/audio/06.wav production/audio/06-fit.wav 8
          printf "file '%s'\n" "$PWD/production/audio/01-fit.wav" "$PWD/production/audio/02-fit.wav" "$PWD/production/audio/03-fit.wav" "$PWD/production/audio/04-fit.wav" "$PWD/production/audio/05-fit.wav" "$PWD/production/audio/06-fit.wav" > production/audio/concat.txt
          ffmpeg -y -v error -f concat -safe 0 -i production/audio/concat.txt -t 60 -c:a pcm_s16le -ar 48000 -ac 2 production/render/master-voice.wav
          ffmpeg -y -v error -i production/render/master-voice.wav -t 60 -c:a libmp3lame -b:a 160k production/render/master-voice.mp3
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name -of json production/render/master-voice.mp3
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 production/render/master-voice.mp3 | cut -d. -f1)" = "60"
      - name: Lint production composition
        run: npx hyperframes lint production/render --verbose
      - name: Visual inspect production composition
        run: npx hyperframes inspect production/render --strict --json
      - name: Render question 0001
        run: npx hyperframes render production/render --output question-0001.mp4 --quality standard --fps 30
      - name: Verify rendered media
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json question-0001.mp4
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 question-0001.mp4)" = "audio"
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 question-0001.mp4 | cut -d. -f1)" = "60"
      - name: Upload question 0001
        uses: actions/upload-artifact@v4
        with:
          name: medical-ai-teacher-question-0001
          path: question-0001.mp4
          if-no-files-found: error
          retention-days: 14
