name: Produce Question Bank Videos

on:
  workflow_dispatch:
  push:
    branches: ["agent/import-full-question-bank"]
    paths: ["production/**", "data/question-bank.json", ".github/workflows/production-batch-001.yml"]

permissions:
  contents: read

env:
  NODE_VERSION: 22
  TTS_VOICE: af_nova

jobs:
  production-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate complete question bank
        run: |
          set -euo pipefail
          test -s data/question-bank.json
          python - <<'PY'
          import json
          p='data/question-bank.json'
          d=json.load(open(p,encoding='utf-8'))
          assert isinstance(d,list) and len(d)>0
          print('QUESTION_COUNT=',len(d))
          print('QUESTIONS_WITH_SOURCE_ANSWER=',sum(bool(x.get('source_indicated_answer')) for x in d))
          print('QUESTIONS_NEEDING_ANSWER_RESOLUTION=',sum(not bool(x.get('source_indicated_answer')) for x in d))
          PY
      - name: Validate Master Single Teacher template
        run: |
          set -euo pipefail
          test -f production/render/index.html
          ! grep -Eqi 'DR\. ANAS|MAHER|student|dialogue' production/render/index.html
          grep -qi 'teacher' production/render/index.html
      - name: Validate production renderer
        run: |
          set -euo pipefail
          test -f data/scene-engine.js
          test -f data/video-engine.js
          test -f data/video-renderer.js
          test -f data/video-script.js
          test -f data/voice-config.js
          echo 'Production renderer files OK'
      - name: Create production manifest
        run: |
          set -euo pipefail
          mkdir -p production/manifests
          python - <<'PY'
          import json, pathlib
          d=json.load(open('data/question-bank.json',encoding='utf-8'))
          out=[]
          for i,q in enumerate(d,1):
              out.append({
                'production_number': i,
                'question_id': q.get('id'),
                'source': q.get('source'),
                'has_source_answer': bool(q.get('source_indicated_answer')),
                'status': 'READY_FOR_PRODUCTION' if q.get('source_indicated_answer') else 'ANSWER_RESOLUTION_REQUIRED'
              })
          pathlib.Path('production/manifests/full-question-bank-production.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MANIFEST_COUNT=',len(out))
          PY
      - name: Upload production manifest
        uses: actions/upload-artifact@v4
        with:
          name: medical-ai-teacher-full-production-manifest
          path: production/manifests/full-question-bank-production.json
          if-no-files-found: error
          retention-days: 30
