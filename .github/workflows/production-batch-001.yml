name: Produce Batch 001

on:
  workflow_dispatch:
  push:
    branches: ["agent/import-full-question-bank"]
    paths: ["production/**", ".github/workflows/production-batch-001.yml"]

permissions:
  contents: read

env:
  NODE_VERSION: 22
  VOICE_01_URL: https://www.aidocmaker.com/g0/audio?name=20d68d09d3db4b689f021b8645c7c287
  VOICE_02_URL: https://www.aidocmaker.com/g0/audio?name=febeb1b808d742dc8c0fe00130f76f6d
  VOICE_03_URL: https://www.aidocmaker.com/g0/audio?name=63407e0aa5e4484886d61a234a233b35
  VOICE_04_URL: https://www.aidocmaker.com/g0/audio?name=7cab004c75914708ab7c51c303f9f51f
  VOICE_05_URL: https://www.aidocmaker.com/g0/audio?name=95702b1effba4d9d86ca6d59ffbc6293
  VOICE_06_URL: https://www.aidocmaker.com/g0/audio?name=c2530e41037540fdad6913ea1ff401f2

jobs:
  produce-q0001:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure FFmpeg is available
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Download and assemble voice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/audio
          for n in 01 02 03 04 05 06; do
            url="$(printenv VOICE_${n}_URL)"
            curl --http1.1 -fL --retry 5 --retry-all-errors --retry-delay 2 -A "Mozilla/5.0" "$url" -o "production/audio/${n}.mp3"
            test -s "production/audio/${n}.mp3"
            ffprobe -v error -show_entries format=format_name,duration -of default=noprint_wrappers=1 "production/audio/${n}.mp3"
          done
          fit_audio() {
            local src="$1" dst="$2" target="$3"
            local dur ratio
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$src")
            ratio=$(awk -v d="$dur" -v t="$target" 'BEGIN { r=d/t; if (r<0.5) r=0.5; if (r>2) r=2; printf "%.6f", r }')
            ffmpeg -y -v error -i "$src" -af "atempo=${ratio},apad" -t "$target" -ar 48000 -ac 2 -c:a pcm_s16le "$dst"
          }
          fit_audio production/audio/01.mp3 production/audio/01.wav 10
          fit_audio production/audio/02.mp3 production/audio/02.wav 8
          fit_audio production/audio/03.mp3 production/audio/03.wav 12
          fit_audio production/audio/04.mp3 production/audio/04.wav 12
          fit_audio production/audio/05.mp3 production/audio/05.wav 10
          fit_audio production/audio/06.mp3 production/audio/06.wav 8
          printf "file '%s'\n" "$PWD/production/audio/01.wav" "$PWD/production/audio/02.wav" "$PWD/production/audio/03.wav" "$PWD/production/audio/04.wav" "$PWD/production/audio/05.wav" "$PWD/production/audio/06.wav" > production/audio/concat.txt
          ffmpeg -y -v error -f concat -safe 0 -i production/audio/concat.txt -c:a pcm_s16le production/render/master-voice.wav
          ffmpeg -y -v error -i production/render/master-voice.wav -c:a libmp3lame -b:a 160k production/render/master-voice.mp3
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name -of json production/render/master-voice.mp3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install HyperFrames
        run: npm install --no-save hyperframes
      - name: Lint production composition
        run: npx hyperframes lint production/render
      - name: Visual inspect production composition
        run: npx hyperframes inspect production/render --strict --json
      - name: Render question 0001
        run: npx hyperframes render production/render --output question-0001.mp4 --quality standard --fps 30
      - name: Verify rendered media
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json question-0001.mp4
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 question-0001.mp4)" = "audio"
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 question-0001.mp4 | cut -d. -f1)" = "60"
      - name: Upload question 0001
        uses: actions/upload-artifact@v4
        with:
          name: medical-ai-teacher-question-0001
          path: question-0001.mp4
          if-no-files-found: error
          retention-days: 14