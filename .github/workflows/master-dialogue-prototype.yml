name: Master Dialogue Prototype

on:
  push:
    branches: ["agent/import-full-question-bank"]
    paths: [".github/workflows/master-dialogue-prototype.yml"]
  workflow_dispatch:

jobs:
  render-master-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg curl
      - name: Build Arabic dialogue audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/master-dialogue/audio production/master-dialogue/output
          urls=(
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/a82ceb86-34b7-4709-a783-bc4184ce3af5.mp3'
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/cce18d16-39b0-4803-bf40-a4be58d7e729.mp3'
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b3db6a2d-dd78-43ec-b34c-e29d338e3baf.mp3'
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/8752b735-99d8-4b08-9df3-505d395e4f90.mp3'
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/9e3ea25b-343a-4db7-a221-8163106f7882.mp3'
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/bef14e66-c57f-4726-a8f1-c89388c6147e.mp3'
          )
          i=1
          for u in "${urls[@]}"; do
            curl -L --fail --retry 5 --retry-delay 3 "$u" -o "production/master-dialogue/audio/$i.mp3"
            test -s "production/master-dialogue/audio/$i.mp3"
            i=$((i+1))
          done
          for i in 1 2 3 4 5 6; do ffmpeg -y -v error -i "production/master-dialogue/audio/$i.mp3" -ar 48000 -ac 2 "production/master-dialogue/audio/$i.wav"; done
          printf "file '%s'\n" "$PWD/production/master-dialogue/audio/1.wav" "$PWD/production/master-dialogue/audio/2.wav" "$PWD/production/master-dialogue/audio/3.wav" "$PWD/production/master-dialogue/audio/4.wav" "$PWD/production/master-dialogue/audio/5.wav" "$PWD/production/master-dialogue/audio/6.wav" > production/master-dialogue/concat.txt
          ffmpeg -y -v error -f concat -safe 0 -i production/master-dialogue/concat.txt -af 'apad' -t 60 -ar 48000 -ac 2 -c:a libmp3lame -b:a 160k production/master-dialogue/master-voice.mp3
      - name: Build dialogue composition
        run: |
          cat > production/master-dialogue/index.html <<'HTML'
          <!doctype html><html lang="ar"><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#f7fafc;font-family:Inter,sans-serif}.clip{visibility:hidden}.stage{width:1920px;height:1080px;position:relative;background:radial-gradient(circle at 80% 15%,#164457 0,transparent 35%),#07111f}.header{position:absolute;top:42px;left:100px;right:100px;display:flex;justify-content:space-between;direction:ltr;color:#8be9e0;font-weight:800}.scene{position:absolute;inset:0;padding:150px 120px 120px;display:flex;flex-direction:column;gap:34px;opacity:0;visibility:hidden}.question{font-size:52px;line-height:1.2;font-weight:800;direction:rtl}.dialogue{display:flex;gap:26px;align-items:center;direction:rtl}.avatar{width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;background:#123442;border:3px solid #8be9e0;flex:0 0 180px}.bubble{background:rgba(14,42,54,.94);border:2px solid rgba(139,233,224,.2);border-radius:28px;padding:32px 42px;font-size:36px;line-height:1.45;flex:1;direction:rtl}.teacher{border-color:#19c3b1}.student{border-color:#6ea8ff}.anas{border-color:#f1c46a}.answer{font-size:68px;color:#8be9e0;font-weight:900;text-align:center;direction:rtl}.caption{position:absolute;bottom:55px;left:140px;right:140px;text-align:center;font-size:24px;color:rgba(247,250,252,.72);direction:rtl}</style></head><body><div id="medical-ai-master" class="stage" data-composition-id="medical-ai-master" data-start="0" data-duration="60" data-fps="30" data-width="1920" data-height="1080"><audio id="master-voice" src="master-voice.mp3" data-start="0" data-duration="60"></audio><div class="header"><span>MEDICAL AI TEACHER</span><span>QUESTION 0001 · SURGERY 2013</span></div><section id="s1" class="scene clip" data-start="0" data-duration="10"><div class="question">في obstructive jaundice، أي clotting factor لا يعتمد على Vitamin K؟</div><div class="dialogue"><div class="avatar student">ماهر</div><div class="bubble">دكتور أنس، قبل ما نختار الإجابة، شو أول خطوة؟</div></div><div class="caption">سؤال → فهم المطلوب قبل اختيار الإجابة</div></section><section id="s2" class="scene clip" data-start="10" data-duration="10"><div class="question">نقرأ الـstem ونحدد المطلوب.</div><div class="dialogue"><div class="avatar anas">أنس</div><div class="bubble">نقرأ السؤال بهدوء، ونحدد بالضبط شو المطلوب، وبعدها نقارن الخيارات.</div></div><div class="caption">د. أنس يبدأ بالـclinical reasoning</div></section><section id="s3" class="scene clip" data-start="20" data-duration="10"><div class="question">ما الذي يبحث عنه السؤال؟</div><div class="dialogue"><div class="avatar teacher">المعلّم</div><div class="bubble">ممتاز يا أنس. السؤال يسأل عن العامل الذي لا يسبب نقصًا في obstructive jaundice.</div></div><div class="caption">المعلّم يحدد الـkey point</div></section><section id="s4" class="scene clip" data-start="30" data-duration="10"><div class="question">الاستثناء، وليس العامل المعتاد.</div><div class="dialogue"><div class="avatar student">ماهر</div><div class="bubble">يعني نبحث عن الاستثناء، مش عن العامل الذي ينقص فعلاً؟</div></div><div class="caption">اقرأ كلمة EXCEPT بعناية</div></section><section id="s5" class="scene clip" data-start="40" data-duration="10"><div class="question">الـreasoning</div><div class="dialogue"><div class="avatar teacher">المعلّم</div><div class="bubble">بالضبط. Factors II, VII, IX, X تعتمد على Vitamin K، أما Factor VIII فلا.</div></div><div class="answer">الإجابة: C — Factor VIII</div></section><section id="s6" class="scene clip" data-start="50" data-duration="10"><div class="question">Take-home</div><div class="dialogue"><div class="avatar anas">أنس</div><div class="bubble">فهمت. نحفظ الـmechanism، ونقرأ صيغة السؤال قبل ما نختار.</div></div><div class="dialogue"><div class="avatar teacher">المعلّم</div><div class="bubble">ممتاز. من الآن، كل سؤال سيكون حوارًا بين ماهر وأنس والمعلّم.</div></div><div class="caption">طالب + د. أنس + المعلّم = فهم، لا حفظ فقط</div></section><script>(function(){const s=[...document.querySelectorAll('.scene')];function seek(t){s.forEach(x=>{const on=t>=+x.dataset.start&&t<+x.dataset.start + +x.dataset.duration;x.style.opacity=on?'1':'0';x.style.visibility=on?'visible':'hidden'})}window.__timelines=window.__timelines||{};window.__timelines['medical-ai-master']={seek,progress:seek,totalDuration:60,duration:60};seek(0)})()</script></div></body></html>
          HTML
      - name: Lint and render prototype
        run: |
          set -euo pipefail
          npm install --no-save hyperframes
          npx hyperframes lint production/master-dialogue --verbose
          npx hyperframes inspect production/master-dialogue --strict --json
          npx hyperframes render production/master-dialogue --output production/master-dialogue/output/question-0001-dialogue-ar.mp4 --quality standard --fps 30
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name,width,height -of json production/master-dialogue/output/question-0001-dialogue-ar.mp4
      - name: Upload prototype
        uses: actions/upload-artifact@v4
        with:
          name: medical-ai-teacher-master-dialogue-ar-q0001
          path: production/master-dialogue/output/question-0001-dialogue-ar.mp4
          retention-days: 14
