name: Master Dialogue Prototype

on:
  push:
    branches: ["agent/import-full-question-bank"]
    paths: [".github/workflows/master-dialogue-prototype.yml"]
  workflow_dispatch:

jobs:
  render-master-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg curl
      - name: Build Arabic dialogue audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/master-dialogue/audio production/master-dialogue/output
          urls=(
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/a82ceb86-34b7-4709-a783-bc4184ce3af5.mp3'
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/cce18d16-39b0-4803-bf40-a4be58d7e729.mp3'
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b3db6a2d-dd78-43ec-b34c-e29d338e3baf.mp3'
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/8752b735-99d8-4b08-9df3-505d395e4f90.mp3'
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/9e3ea25b-343a-4db7-a221-8163106f7882.mp3'
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/bef14e66-c57f-4726-a8f1-c89388c6147e.mp3'
          )
          i=1
          for u in "${urls[@]}"; do
            curl -L --fail --retry 5 --retry-delay 3 "$u" -o "production/master-dialogue/audio/$i.mp3"
            test -s "production/master-dialogue/audio/$i.mp3"
            i=$((i+1))
          done
          for i in 1 2 3 4 5 6; do ffmpeg -y -v error -i "production/master-dialogue/audio/$i.mp3" -ar 48000 -ac 2 "production/master-dialogue/audio/$i.wav"; done
          printf "file '%s'\n" "$PWD/production/master-dialogue/audio/1.wav" "$PWD/production/master-dialogue/audio/2.wav" "$PWD/production/master-dialogue/audio/3.wav" "$PWD/production/master-dialogue/audio/4.wav" "$PWD/production/master-dialogue/audio/5.wav" "$PWD/production/master-dialogue/audio/6.wav" > production/master-dialogue/concat.txt
          ffmpeg -y -v error -f concat -safe 0 -i production/master-dialogue/concat.txt -af 'apad' -t 60 -ar 48000 -ac 2 -c:a libmp3lame -b:a 160k production/master-dialogue/master-voice.mp3
      - name: Build dialogue composition
        run: |
          cat > production/master-dialogue/index.html <<'HTML'
          <!doctype html><html lang="ar"><head><meta charset="utf-8"><style>
          *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#f7fafc;font-family:Inter,Arial,sans-serif}.clip{visibility:hidden}.stage{width:1920px;height:1080px;position:relative;background:radial-gradient(circle at 80% 15%,#164457 0,transparent 35%),#07111f}.header{position:absolute;top:42px;left:100px;right:100px;display:flex;justify-content:space-between;direction:ltr;color:#8be9e0;font-weight:800}.scene{position:absolute;inset:0;padding:135px 110px 105px;display:flex;flex-direction:column;gap:24px;opacity:0;visibility:hidden}.question{font-size:50px;line-height:1.2;font-weight:800;direction:rtl;text-align:right}.dialogue{display:flex;gap:22px;align-items:center;direction:rtl}.avatar{width:145px;height:145px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:800;background:#123442;border:3px solid #8be9e0;flex:0 0 145px}.bubble{background:rgba(14,42,54,.94);border:2px solid rgba(139,233,224,.2);border-radius:26px;padding:25px 34px;font-size:33px;line-height:1.4;flex:1;direction:rtl;text-align:right}.teacher{border-color:#19c3b1}.student{border-color:#6ea8ff}.anas{border-color:#f1c46a}.answer{font-size:64px;color:#8be9e0;font-weight:900;text-align:center;direction:rtl}.caption{position:absolute;bottom:42px;left:120px;right:120px;text-align:center;font-size:23px;color:rgba(247,250,252,.72);direction:rtl}.options{display:grid;grid-template-columns:1fr 1fr;gap:16px;direction:rtl}.option{padding:20px 28px;border-radius:20px;background:#102c3a;border:2px solid rgba(139,233,224,.18);font-size:34px;font-weight:750;direction:ltr;text-align:left}.option.correct{border-color:#8be9e0;background:#123f45}.visual-row{display:flex;gap:28px;align-items:center;direction:ltr}.visual-card{flex:1;background:rgba(10,28,39,.9);border:2px solid rgba(139,233,224,.2);border-radius:24px;padding:16px}.visual-title{text-align:center;font-size:25px;font-weight:800;margin-bottom:6px;color:#8be9e0}.visual-card svg{display:block;width:100%;height:190px}.mini-factors{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;direction:ltr}.factor{padding:12px 18px;border-radius:14px;background:#173b4b;font-size:27px;font-weight:800}.factor.vk{border:2px solid #f1c46a}.factor.novk{border:2px solid #8be9e0}.explain{font-size:31px;line-height:1.35;text-align:center;direction:rtl}
          </style></head><body><div id="medical-ai-master" class="stage" data-composition-id="medical-ai-master" data-start="0" data-duration="60" data-fps="30" data-width="1920" data-height="1080"><audio id="master-voice" src="master-voice.mp3" data-start="0" data-duration="60"></audio><div class="header"><span>MEDICAL AI TEACHER</span><span>QUESTION 0001 · SURGERY 2013</span></div>
          <section id="s1" class="scene clip" data-start="0" data-duration="10"><div class="question">في obstructive jaundice، أي clotting factor لا يعتمد على Vitamin K؟</div><div class="options"><div class="option">A — Factor II</div><div class="option">B — Factor VII</div><div class="option">C — Factor VIII</div><div class="option">D — Factor IX</div></div><div class="dialogue"><div class="avatar student">ماهر</div><div class="bubble">دكتور أنس، هاي هي الخيارات. شو أول إشي ننتبه له؟</div></div><div class="caption">أولًا: اقرأ السؤال والخيارات كاملة</div></section>
          <section id="s2" class="scene clip" data-start="10" data-duration="10"><div class="question">خلينا نشوف الصورة الطبية بدل الحفظ.</div><div class="visual-row"><div class="visual-card"><div class="visual-title">Obstructive jaundice</div><svg viewBox="0 0 520 190" aria-label="Liver and bile duct diagram"><path d="M90 80 Q150 25 275 48 Q365 64 430 105 Q360 145 250 148 Q145 150 90 115 Z" fill="#9b684d" stroke="#f1c46a" stroke-width="5"/><path d="M260 90 L340 110 L425 110" fill="none" stroke="#8be9e0" stroke-width="10" stroke-linecap="round"/><circle cx="342" cy="110" r="15" fill="#e7d27a"/><path d="M425 110 L475 150" fill="none" stroke="#8be9e0" stroke-width="8"/><text x="105" y="105" fill="#fff" font-size="22">Liver</text><text x="350" y="95" fill="#fff" font-size="20">Bile duct</text><text x="360" y="145" fill="#f1c46a" font-size="19">obstruction</text></svg></div><div class="visual-card"><div class="visual-title">Vitamin K–dependent factors</div><div class="mini-factors"><span class="factor vk">II</span><span class="factor vk">VII</span><span class="factor vk">IX</span><span class="factor vk">X</span><span class="factor novk">VIII</span></div><div class="explain">المطلوب هو الاستثناء</div></div></div><div class="dialogue"><div class="avatar anas">أنس</div><div class="bubble">الـobstruction يقلل امتصاص Vitamin K، لذلك نركز على العوامل المعتمدة عليه.</div></div><div class="caption">الصورة تساعدنا نفهم الـmechanism</div></section>
          <section id="s3" class="scene clip" data-start="20" data-duration="10"><div class="question">د. أنس، أي عوامل تعتمد على Vitamin K؟</div><div class="visual-row"><div class="visual-card"><div class="visual-title">Vitamin K pathway</div><div class="mini-factors"><span class="factor vk">II</span><span class="factor vk">VII</span><span class="factor vk">IX</span><span class="factor vk">X</span></div></div><div class="visual-card"><div class="visual-title">Not Vitamin K dependent</div><div class="mini-factors"><span class="factor novk">VIII</span></div></div></div><div class="dialogue"><div class="avatar teacher">المعلّم</div><div class="bubble">ممتاز. II وVII وIX وX تعتمد على Vitamin K. الآن دورنا نبحث عن العامل الخارج من المجموعة.</div></div><div class="caption">II · VII · IX · X = Vitamin K dependent</div></section>
          <section id="s4" class="scene clip" data-start="30" data-duration="10"><div class="question">ماهر، لو بدنا نحلها بالاستبعاد؟</div><div class="options"><div class="option">A — Factor II ✓ Vitamin K</div><div class="option">B — Factor VII ✓ Vitamin K</div><div class="option correct">C — Factor VIII ← الاستثناء</div><div class="option">D — Factor IX ✓ Vitamin K</div></div><div class="dialogue"><div class="avatar student">ماهر</div><div class="bubble">إذن A وB وD مربوطين بـVitamin K، فـ C هو المختلف.</div></div><div class="caption">Eliminate → Compare → Choose</div></section>
          <section id="s5" class="scene clip" data-start="40" data-duration="10"><div class="question">الـreasoning النهائي</div><div class="visual-row"><div class="visual-card"><div class="visual-title">Vitamin K dependent</div><div class="mini-factors"><span class="factor vk">II</span><span class="factor vk">VII</span><span class="factor vk">IX</span><span class="factor vk">X</span></div></div><div class="visual-card"><div class="visual-title">Exception</div><div class="mini-factors"><span class="factor novk">VIII</span></div></div></div><div class="dialogue"><div class="avatar teacher">المعلّم</div><div class="bubble">بالضبط. Factor VIII لا يعتمد على Vitamin K، لذلك هو الإجابة الصحيحة في هذا السؤال.</div></div><div class="answer">C — Factor VIII</div></section>
          <section id="s6" class="scene clip" data-start="50" data-duration="10"><div class="question">Take-home: احفظها كـpattern</div><div class="visual-row"><div class="visual-card"><div class="visual-title">احفظها: 1972</div><div class="explain">II + VII + IX + X</div><div class="caption">Vitamin K dependent</div></div><div class="visual-card"><div class="visual-title">الاستثناء</div><div class="answer">VIII</div><div class="explain">لا يعتمد على Vitamin K</div></div></div><div class="dialogue"><div class="avatar anas">أنس</div><div class="bubble">فهمت. بدل ما أحفظ الإجابة وحدها، أحفظ المجموعة والاستثناء.</div></div><div class="dialogue"><div class="avatar teacher">المعلّم</div><div class="bubble">ممتاز. هذا هو أسلوبنا: سؤال + خيارات + حوار + صورة + reasoning.</div></div><div class="caption">ماهر + د. أنس + المعلّم = فهم، لا حفظ فقط</div></section>
          <script>(function(){const s=[...document.querySelectorAll('.scene')];function seek(t){s.forEach(x=>{const on=t>=+x.dataset.start&&t<+x.dataset.start + +x.dataset.duration;x.style.opacity=on?'1':'0';x.style.visibility=on?'visible':'hidden'})}window.__timelines=window.__timelines||{};window.__timelines['medical-ai-master']={seek,progress:seek,totalDuration:60,duration:60};seek(0)})()</script></div></body></html>
          HTML
      - name: Lint and render prototype
        run: |
          set -euo pipefail
          npm install --no-save hyperframes
          npx hyperframes lint production/master-dialogue --verbose
          npx hyperframes inspect production/master-dialogue --strict --json
          npx hyperframes render production/master-dialogue --output production/master-dialogue/output/question-0001-dialogue-ar.mp4 --quality standard --fps 30
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name,width,height -of json production/master-dialogue/output/question-0001-dialogue-ar.mp4
      - name: Upload prototype
        uses: actions/upload-artifact@v4
        with:
          name: medical-ai-teacher-master-dialogue-ar-q0001-v2
          path: production/master-dialogue/output/question-0001-dialogue-ar.mp4
          retention-days: 14
