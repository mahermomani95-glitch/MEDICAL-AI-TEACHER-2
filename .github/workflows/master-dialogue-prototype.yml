name: Master Visual Explainer V3

on:
  push:
    branches: ["agent/import-full-question-bank"]
    paths: [".github/workflows/master-dialogue-prototype.yml"]
  workflow_dispatch:

jobs:
  render-master-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg curl
      - name: Build single Arabic teacher audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/master-v3/output
          curl -L --fail --retry 5 --retry-delay 3 "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/0e537842-e9ab-49e8-9d19-d843fb7005be.mp3" -o production/master-v3/teacher.mp3
          test -s production/master-v3/teacher.mp3
          ffmpeg -y -v error -i production/master-v3/teacher.mp3 -ar 48000 -ac 2 production/master-v3/teacher.wav
          ffmpeg -y -v error -i production/master-v3/teacher.wav -af 'apad' -t 60 -ar 48000 -ac 2 -c:a libmp3lame -b:a 160k production/master-v3/teacher-60s.mp3
      - name: Build V3 visual explainer
        run: |
          cat > production/master-v3/index.html <<'HTML'
          <!doctype html><html lang="ar"><head><meta charset="utf-8"><style>
          *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f2e9;color:#17232d;font-family:Inter,Arial,sans-serif}.stage{width:1920px;height:1080px;position:relative;background:linear-gradient(135deg,#f8f5ee,#eaf3f0)}.clip{visibility:hidden}.scene{position:absolute;inset:0;padding:105px 125px 90px;opacity:0;visibility:hidden}.top{display:flex;justify-content:space-between;align-items:center;direction:ltr;color:#234b55;font-weight:900;font-size:24px}.brand{letter-spacing:1px}.qnum{background:#173f4a;color:#fff;border-radius:18px;padding:12px 22px}.question{margin-top:42px;background:#fff;border-radius:30px;padding:38px 50px;font-size:50px;line-height:1.25;font-weight:900;text-align:right;direction:rtl;box-shadow:0 14px 35px rgba(40,70,70,.10)}.options{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:18px;direction:ltr}.option{background:#fff;border:3px solid #d8e3df;border-radius:22px;padding:24px 30px;font-size:36px;font-weight:850;box-shadow:0 8px 20px rgba(40,70,70,.07)}.option.correct{border-color:#0d9b8b;background:#e7f7f3}.teacher{position:absolute;left:125px;right:125px;bottom:75px;display:flex;align-items:center;gap:24px;direction:ltr}.teacher-badge{width:92px;height:92px;border-radius:50%;background:#173f4a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;flex:0 0 92px}.speech{background:#173f4a;color:#fff;border-radius:24px;padding:22px 32px;font-size:30px;line-height:1.35;flex:1;text-align:right;direction:rtl}.visuals{margin-top:34px;display:grid;grid-template-columns:1.05fr .95fr;gap:28px}.card{background:#fff;border-radius:28px;padding:25px;border:2px solid #d8e3df;box-shadow:0 10px 24px rgba(40,70,70,.08)}.title{text-align:center;color:#23515b;font-size:29px;font-weight:900;margin-bottom:12px}.card svg{width:100%;height:230px;display:block}.factors{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:28px;direction:ltr}.factor{font-size:42px;font-weight:900;padding:16px 25px;border-radius:18px;background:#edf5f2;border:3px solid #a9d8cf}.factor.exception{background:#fff4db;border-color:#e4b95c}.center-note{text-align:center;font-size:34px;font-weight:850;direction:rtl;margin-top:25px}.eliminate{margin-top:35px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.strike{background:#fff;border-radius:20px;padding:24px;font-size:32px;font-weight:850;border:2px solid #e2d7d0;direction:ltr}.strike span{color:#a24a42}.answer{margin-top:34px;background:#173f4a;color:#fff;border-radius:30px;padding:30px;text-align:center;font-size:62px;font-weight:950;direction:ltr}.tip{margin-top:32px;background:#fff3d7;border:3px solid #e4b95c;border-radius:28px;padding:30px;text-align:center;font-size:34px;font-weight:900;direction:rtl}.small{font-size:25px;color:#50636b;text-align:center;margin-top:14px;direction:rtl}
          </style></head><body><div id="medical-ai-master" class="stage" data-composition-id="medical-ai-master" data-start="0" data-duration="60" data-fps="30" data-width="1920" data-height="1080"><audio id="teacher-voice" src="teacher-60s.mp3" data-start="0" data-duration="60"></audio>
          <section id="scene-1" class="scene clip" data-start="0" data-duration="12"><div class="top"><div class="brand">MEDICAL AI TEACHER</div><div class="qnum">QUESTION 0001</div></div><div class="question">في obstructive jaundice، أي clotting factor لا يعتمد على Vitamin K؟</div><div class="options"><div class="option">A — Factor II</div><div class="option">B — Factor VII</div><div class="option">C — Factor VIII</div><div class="option">D — Factor IX</div></div><div class="teacher"><div class="teacher-badge">المعلّم</div><div class="speech">خلينا نبدأ بالسؤال ونقرأ الخيارات كاملة قبل ما نختار.</div></div></section>
          <section id="scene-2" class="scene clip" data-start="12" data-duration="10"><div class="top"><div class="brand">UNDERSTAND THE MECHANISM</div><div class="qnum">STEP 1</div></div><div class="question">ليش obstructive jaundice مهم في هذا السؤال؟</div><div class="visuals"><div class="card"><div class="title">Obstructive jaundice</div><svg viewBox="0 0 700 230"><path d="M100 100 Q210 35 370 55 Q500 72 610 125 Q500 185 340 185 Q185 185 100 140 Z" fill="#b97855" stroke="#e4b95c" stroke-width="7"/><path d="M365 115 L470 135 L610 135" fill="none" stroke="#0d9b8b" stroke-width="13" stroke-linecap="round"/><circle cx="470" cy="135" r="20" fill="#e4b95c"/><path d="M610 135 L665 185" fill="none" stroke="#0d9b8b" stroke-width="10"/><text x="145" y="130" fill="#fff" font-size="28">Liver</text><text x="480" y="112" fill="#fff" font-size="25">Bile duct</text></svg></div><div class="card"><div class="title">الفكرة</div><div class="center-note">انسداد القناة الصفراوية ↓<br/>امتصاص Vitamin K ↓</div><div class="factors"><span class="factor">II</span><span class="factor">VII</span><span class="factor">IX</span><span class="factor">X</span></div></div></div><div class="teacher"><div class="teacher-badge">المعلّم</div><div class="speech">في الانسداد الصفراوي يقل امتصاص Vitamin K، لذلك تتأثر عوامل التخثر المعتمدة عليه.</div></div></section>
          <section id="scene-3" class="scene clip" data-start="22" data-duration="10"><div class="top"><div class="brand">KNOW THE GROUP</div><div class="qnum">STEP 2</div></div><div class="question">احفظ المجموعة: II، VII، IX، X</div><div class="visuals"><div class="card"><div class="title">Vitamin K dependent</div><div class="factors"><span class="factor">II</span><span class="factor">VII</span><span class="factor">IX</span><span class="factor">X</span></div><div class="small">هذه هي المجموعة التي تعتمد على Vitamin K.</div></div><div class="card"><div class="title">الاستثناء</div><div class="factors"><span class="factor exception">VIII</span></div><div class="small">VIII ليس ضمن المجموعة.</div></div></div><div class="teacher"><div class="teacher-badge">المعلّم</div><div class="speech">إذن بدل ما نحفظ حرف الإجابة، نحفظ المجموعة ثم نبحث عن الـexception.</div></div></section>
          <section id="scene-4" class="scene clip" data-start="32" data-duration="10"><div class="top"><div class="brand">ELIMINATION</div><div class="qnum">STEP 3</div></div><div class="question">نستبعد الخيارات المرتبطة بـVitamin K</div><div class="eliminate"><div class="strike">A — Factor II <span>✓ Vitamin K</span></div><div class="strike">B — Factor VII <span>✓ Vitamin K</span></div><div class="strike" style="border-color:#0d9b8b;background:#e7f7f3">C — Factor VIII <b>← الاستثناء</b></div><div class="strike">D — Factor IX <span>✓ Vitamin K</span></div></div><div class="teacher"><div class="teacher-badge">المعلّم</div><div class="speech">ثلاثة خيارات داخل المجموعة. الخيار المختلف هو C.</div></div></section>
          <section id="scene-5" class="scene clip" data-start="42" data-duration="9"><div class="top"><div class="brand">ANSWER</div><div class="qnum">STEP 4</div></div><div class="question">إذن ما هي الإجابة الصحيحة؟</div><div class="answer">C — Factor VIII</div><div class="visuals"><div class="card"><div class="title">Vitamin K dependent</div><div class="factors"><span class="factor">II</span><span class="factor">VII</span><span class="factor">IX</span><span class="factor">X</span></div></div><div class="card"><div class="title">Exception</div><div class="factors"><span class="factor exception">VIII</span></div></div></div></section>
          <section id="scene-6" class="scene clip" data-start="51" data-duration="9"><div class="top"><div class="brand">EXAM TIP</div><div class="qnum">TAKE-HOME</div></div><div class="question">لا تحفظ الإجابة وحدها — احفظ الـpattern</div><div class="tip">II + VII + IX + X = Vitamin K dependent<br/><br/><b>VIII = Exception</b></div><div class="teacher"><div class="teacher-badge">المعلّم</div><div class="speech">وهكذا تقدر تحل السؤال حتى لو تغيّر ترتيب الخيارات. افهم المجموعة، ثم ابحث عن الاستثناء.</div></div></section>
          <script>(function(){const scenes=[...document.querySelectorAll('.scene')];function seek(t){scenes.forEach(s=>{const on=t>=+s.dataset.start&&t<+s.dataset.start + +s.dataset.duration;s.style.opacity=on?'1':'0';s.style.visibility=on?'visible':'hidden'})}window.__timelines=window.__timelines||{};window.__timelines['medical-ai-master']={seek,progress:seek,totalDuration:60,duration:60};seek(0)})()</script></div></body></html>
          HTML
      - name: Lint inspect and render V3
        run: |
          set -euo pipefail
          npm install --no-save hyperframes
          npx hyperframes lint production/master-v3 --verbose
          npx hyperframes inspect production/master-v3 --strict --json
          npx hyperframes render production/master-v3 --output production/master-v3/output/question-0001-v3-ar.mp4 --quality standard --fps 30
          test -s production/master-v3/output/question-0001-v3-ar.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name,width,height -of json production/master-v3/output/question-0001-v3-ar.mp4
      - name: Upload V3
        uses: actions/upload-artifact@v4
        with:
          name: medical-ai-teacher-master-v3-q0001-ar
          path: production/master-v3/output/question-0001-v3-ar.mp4
          retention-days: 14
