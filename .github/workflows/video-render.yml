name: Render educational video preview

on:
  workflow_dispatch:
    inputs:
      quality:
        description: Render quality
        required: true
        default: standard
        type: choice
        options: [draft, standard, high]
  push:
    branches: ["agent/import-full-question-bank"]
    paths: ["video/**", ".github/workflows/video-render.yml"]

permissions:
  contents: read

env:
  NODE_VERSION: 22
  VOICE_URL: https://www.aidocmaker.com/g0/audio?name=ad68c07c628c4d52b136040cfcf9d176

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure FFmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "Using preinstalled FFmpeg: $(command -v ffmpeg)"
          else
            echo "FFmpeg is not preinstalled; installing from the runner package cache"
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Download master voice
        shell: bash
        run: |
          set -euo pipefail
          rm -f video/master-voice.mp3
          curl --http1.1 -fL --retry 5 --retry-all-errors --retry-delay 2 \
            -A "Mozilla/5.0" \
            "$VOICE_URL" -o video/master-voice.mp3
          test -s video/master-voice.mp3
          file video/master-voice.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 video/master-voice.mp3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install HyperFrames
        run: npm install --no-save hyperframes
      - name: Lint composition
        run: npx hyperframes lint video
      - name: Visual inspect
        run: npx hyperframes inspect video --strict --json
      - name: Render MP4 preview
        run: npx hyperframes render video --output medical-ai-teacher-preview.mp4 --quality "${{ inputs.quality || 'standard' }}" --fps 30
      - name: Verify rendered media
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json medical-ai-teacher-preview.mp4
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: medical-ai-teacher-preview
          path: medical-ai-teacher-preview.mp4
          if-no-files-found: error
          retention-days: 7
