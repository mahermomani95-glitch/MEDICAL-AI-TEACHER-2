name: Render educational video preview

on:
  workflow_dispatch:
  push:
    branches:
      - agent/import-full-question-bank

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install HyperFrames
        run: npm install --no-save hyperframes

      - name: Lint composition
        run: npx hyperframes lint video

      - name: Visual inspect
        run: npx hyperframes inspect video --strict

      - name: Render MP4 preview
        run: npx hyperframes render video --output medical-ai-teacher-preview.mp4 --quality standard --fps 30

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: medical-ai-teacher-preview
          path: medical-ai-teacher-preview.mp4
          retention-days: 7
