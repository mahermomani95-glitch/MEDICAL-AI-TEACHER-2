name: Medical AI Teacher — Main Batch Render

on:
  push:
    branches: ["main"]
    paths:
      - "production/batch-*.json"
      - "production/scripts/build-batch.mjs"
      - ".github/workflows/render-batch-main.yml"
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch JSON path"
        required: true
        default: "production/batch-001.json"
      output:
        description: "Output directory"
        required: true
        default: "production/generated"

jobs:
  render-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HyperFrames
        run: npm install --no-save hyperframes
      - name: Build question compositions
        env:
          BATCH: ${{ inputs.batch || 'production/batch-001.json' }}
          OUTPUT: ${{ inputs.output || 'production/generated' }}
        run: node production/scripts/build-batch.mjs "$BATCH" "$OUTPUT"
      - name: Validate single teacher
        env:
          OUTPUT: ${{ inputs.output || 'production/generated' }}
        run: |
          set -euo pipefail
          if grep -RniE 'Dr\. Anas|MAHER|student|conversation' "$OUTPUT"; then
            echo "Secondary character detected"
            exit 1
          fi
      - name: Lint and inspect
        env:
          OUTPUT: ${{ inputs.output || 'production/generated' }}
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r index; do
            dir="$(dirname "$index")"
            npx hyperframes lint "$dir" --verbose
            npx hyperframes inspect "$dir" --strict --json > /dev/null
            count=$((count+1))
          done < <(find "$OUTPUT" -name index.html -type f | sort)
          test "$count" -gt 0
          echo "Validated $count compositions"
      - name: Render MP4 batch
        env:
          OUTPUT: ${{ inputs.output || 'production/generated' }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT/mp4"
          while IFS= read -r index; do
            dir="$(dirname "$index")"
            id="$(basename "$dir")"
            npx hyperframes render "$dir" --output "$OUTPUT/mp4/$id.mp4" --quality standard --fps 30
            ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name,width,height -of json "$OUTPUT/mp4/$id.mp4" > "$OUTPUT/mp4/$id.media.json"
            test -s "$OUTPUT/mp4/$id.mp4"
          done < <(find "$OUTPUT" -mindepth 2 -maxdepth 2 -name index.html -type f | sort)
      - name: Upload MP4 batch
        uses: actions/upload-artifact@v4
        with:
          name: medical-ai-teacher-${{ github.run_number }}-mp4-batch
          path: ${{ inputs.output || 'production/generated' }}/mp4
          retention-days: 14
