<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>المعلم الطبي الذكي</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">المعلم الطبي الذكي</div>
      <div class="subtitle">سؤال → تفكير سريري → شرح هادئ → تثبيت المعلومة</div>
    </div>
    <div class="badge">بنك الأسئلة</div>
  </header>
  <main class="layout">
    <section class="left">
      <div class="label">بنك الأسئلة</div>
      <select id="questionSelect" class="question-select" aria-label="اختيار السؤال"></select>
      <div id="sceneProgress" class="scene-progress">المشهد 1 / 6</div>
      <h1 id="question"></h1>
      <p id="arabic" class="arabic"></p>
      <div id="options" class="options"></div>
      <button id="next" class="next">المشهد التالي ←</button>
    </section>
    <aside class="right">
      <div class="scene-label" id="sceneLabel">المشهد ١ · فهم السؤال</div>
      <div id="visual" class="visual"></div>
      <div id="dialogue" class="dialogue"></div>
    </aside>
  </main>
  <footer>
    <span>معلم واحد • سردية عربية تعليمية</span>
    <span>ترجمة وشرح قبل التثبيت</span>
  </footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
